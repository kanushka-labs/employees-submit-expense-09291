openapi: 3.0.3
info:
  title: Expense Claims API
  version: 0.1.0
  description: Expense claims, their approval, and the payroll export.
servers:
  - url: /
security:
  - oauth2: []
paths:
  /me:
    get:
      operationId: getCaller
      summary: The signed-in caller and the directory groups their token carries
      responses:
        '200':
          description: The signed-in caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caller'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/claims:
    get:
      operationId: listOwnExpenseClaims
      summary: The caller's own claims
      security:
        - oauth2: [claims:read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: The caller's claims, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseClaimList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createOwnExpenseClaim
      summary: Start a claim for the caller
      security:
        - oauth2: [claims:submit]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseClaimInput'
      responses:
        '201':
          description: The new claim, in draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseClaimDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/claims/{claimId}:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    get:
      operationId: getOwnExpenseClaim
      summary: One of the caller's own claims, with its lines and receipts
      security:
        - oauth2: [claims:read]
      responses:
        '200':
          description: The claim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseClaimDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: replaceOwnExpenseClaim
      summary: Replace the lines of the caller's claim while it is undecided
      security:
        - oauth2: [claims:submit]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseClaimInput'
      responses:
        '200':
          description: The corrected claim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseClaimDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/claims/{claimId}/submit:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    post:
      operationId: submitOwnExpenseClaim
      summary: Send one of the caller's claims for approval
      security:
        - oauth2: [claims:submit]
      responses:
        '200':
          description: The claim, now awaiting approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseClaimDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/claims/{claimId}/withdraw:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    post:
      operationId: withdrawOwnExpenseClaim
      summary: Take back one of the caller's claims that is not yet decided
      security:
        - oauth2: [claims:withdraw]
      responses:
        '200':
          description: The claim, now withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseClaimDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/claims/{claimId}/line-items/{lineItemId}/receipt:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
      - $ref: '#/components/parameters/LineItemId'
    get:
      operationId: getOwnReceipt
      summary: The receipt on a line of the caller's own claim
      security:
        - oauth2: [claims:read]
      responses:
        '200':
          description: The receipt file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: attachOwnReceipt
      summary: Attach or replace the receipt on a line of the caller's own claim
      security:
        - oauth2: [claims:submit]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptInput'
      responses:
        '200':
          description: The line, with its receipt attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseLineItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/team/claims:
    get:
      operationId: listTeamExpenseClaims
      summary: Claims submitted by employees sharing a directory group with the caller
      security:
        - oauth2: [claims:review-team]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: The caller's team's claims, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseClaimList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/team/claims/{claimId}:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    get:
      operationId: getTeamExpenseClaim
      summary: One claim from the caller's team, with its lines and receipts
      security:
        - oauth2: [claims:review-team]
      responses:
        '200':
          description: The claim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseClaimDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/team/claims/{claimId}/line-items/{lineItemId}/receipt:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
      - $ref: '#/components/parameters/LineItemId'
    get:
      operationId: getTeamReceipt
      summary: The receipt on a line of a claim from the caller's team
      security:
        - oauth2: [claims:review-team]
      responses:
        '200':
          description: The receipt file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/team/claims/{claimId}/approve:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    post:
      operationId: approveTeamExpenseClaim
      summary: Approve a submitted claim from the caller's team
      security:
        - oauth2: [claims:review-team]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInput'
      responses:
        '200':
          description: The claim, now approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseClaimDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/team/claims/{claimId}/reject:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    post:
      operationId: rejectTeamExpenseClaim
      summary: Reject a submitted claim from the caller's team, with a reason
      security:
        - oauth2: [claims:review-team]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInput'
      responses:
        '200':
          description: The claim, now rejected and back with its employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseClaimDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /claims:
    get:
      operationId: listAllExpenseClaims
      summary: Every claim of the company, for finance
      security:
        - oauth2: [claims:read-all]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/FromFilter'
        - $ref: '#/components/parameters/ToFilter'
      responses:
        '200':
          description: Every matching claim, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseClaimList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /claims/{claimId}:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    get:
      operationId: getAllExpenseClaim
      summary: One claim of the company, with its lines, for finance
      security:
        - oauth2: [claims:read-all]
      responses:
        '200':
          description: The claim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseClaimDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /claim-exports:
    post:
      operationId: createClaimExport
      summary: Export the approved claims of a period, and mark them exported
      security:
        - oauth2: [claims:export]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseClaimExportInput'
      responses:
        '201':
          description: The export, with its line count and total
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseClaimExport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /claim-exports/{exportId}/csv:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      operationId: downloadClaimExport
      summary: Download an export as CSV, one row per expense line
      security:
        - oauth2: [claims:export]
      responses:
        '200':
          description: The CSV payroll imports
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /health:
    get:
      operationId: getHealth
      summary: Liveness of the service
      security: []
      responses:
        '200':
          description: The service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    description: Always "ok"
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            "claims:read": See the caller's own claims and their receipts
            "claims:submit": Create, correct and send the caller's own claims
            "claims:withdraw": Take back one of the caller's own undecided claims
            "claims:review-team": See and decide the claims of employees sharing a directory group
            "claims:read-all": See every claim of the company
            "claims:export": Run a payroll export and download it
  parameters:
    Limit:
      name: limit
      in: query
      description: Items per page
      schema:
        type: integer
        default: 20
        maximum: 100
    Offset:
      name: offset
      in: query
      description: Zero-based start index
      schema:
        type: integer
        default: 0
    StatusFilter:
      name: status
      in: query
      description: Only claims in this state
      schema:
        $ref: '#/components/schemas/ClaimStatus'
    FromFilter:
      name: from
      in: query
      description: Only claims whose lines fall on or after this date
      schema:
        type: string
        format: date
    ToFilter:
      name: to
      in: query
      description: Only claims whose lines fall on or before this date
      schema:
        type: string
        format: date
    ClaimId:
      name: claimId
      in: path
      required: true
      description: The claim's identifier
      schema:
        type: string
    LineItemId:
      name: lineItemId
      in: path
      required: true
      description: The expense line's identifier
      schema:
        type: string
    ExportId:
      name: exportId
      in: path
      required: true
      description: The export's identifier
      schema:
        type: string
  responses:
    BadRequest:
      description: The request is not well formed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or insufficient credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such resource for this caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The claim is not in a state that allows this
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: HTTP or application error code
        message:
          type: string
          description: short human-readable label
        description:
          type: string
          description: detailed explanation
        moreInfo:
          type: string
          description: URI to documentation
    Caller:
      type: object
      required: [username, displayName, groups]
      properties:
        username:
          type: string
          description: The signed-in username
        displayName:
          type: string
          description: The caller's display name
        groups:
          type: array
          description: The directory groups the caller's token carries
          items:
            type: string
    ClaimStatus:
      type: string
      description: Where a claim stands
      enum: [draft, submitted, approved, rejected, withdrawn]
    ExpenseCategory:
      type: string
      description: The fixed list of expense categories the product ships
      enum: [travel, accommodation, meals, supplies, client-entertainment, training, other]
    ExpenseLineItem:
      type: object
      required: [id, expenseDate, category, amount]
      properties:
        id:
          type: string
          description: The line's identifier
        expenseDate:
          type: string
          format: date
          description: The day the expense was incurred
        category:
          $ref: '#/components/schemas/ExpenseCategory'
        amount:
          type: number
          description: In the company's single currency
        note:
          type: string
          description: What the expense was for
        receipt:
          type: object
          nullable: true
          description: The receipt attached to this line, or null when none is attached
          properties:
            fileName:
              type: string
            contentType:
              type: string
            size:
              type: integer
              description: Bytes
    ExpenseClaim:
      type: object
      required: [id, reference, submitterName, status, totalAmount, lineItemCount]
      properties:
        id:
          type: string
          description: The claim's identifier
        reference:
          type: string
          description: 'The human reference, e.g. CLM-0041'
        submitterName:
          type: string
          description: The employee who filed the claim
        status:
          $ref: '#/components/schemas/ClaimStatus'
        totalAmount:
          type: number
          description: The sum of the claim's lines
        lineItemCount:
          type: integer
          description: How many expense lines the claim holds
        submittedOn:
          type: string
          format: date
          nullable: true
          description: The day it went for approval
        decidedOn:
          type: string
          format: date
          nullable: true
          description: The day it was approved or rejected
        decidedBy:
          type: string
          nullable: true
          description: Who approved or rejected it
        exportedOn:
          type: string
          format: date
          nullable: true
          description: The day an export included it
    ExpenseClaimDetail:
      allOf:
        - $ref: '#/components/schemas/ExpenseClaim'
        - type: object
          required: [lineItems]
          properties:
            lineItems:
              type: array
              items:
                $ref: '#/components/schemas/ExpenseLineItem'
            decisionComment:
              type: string
              description: Why the manager rejected it
    ExpenseClaimList:
      type: object
      required: [count, data]
      properties:
        count:
          type: integer
          description: Total matching claims
        next:
          type: string
          nullable: true
          description: Relative URI of the next page
        previous:
          type: string
          nullable: true
          description: Relative URI of the previous page
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseClaim'
    ExpenseClaimInput:
      type: object
      required: [lineItems]
      properties:
        lineItems:
          type: array
          description: The claim's expense lines, replacing any it already had
          items:
            $ref: '#/components/schemas/ExpenseLineItemInput'
    ExpenseLineItemInput:
      type: object
      required: [expenseDate, category, amount]
      properties:
        expenseDate:
          type: string
          format: date
          description: The day the expense was incurred
        category:
          $ref: '#/components/schemas/ExpenseCategory'
        amount:
          type: number
          description: In the company's single currency
        note:
          type: string
          description: What the expense was for
    ReceiptInput:
      type: object
      required: [fileName, contentType, contentBase64]
      properties:
        fileName:
          type: string
          description: The uploaded file's name
        contentType:
          type: string
          description: 'application/pdf, image/jpeg or image/png'
        contentBase64:
          type: string
          description: The file's bytes, base64-encoded
    DecisionInput:
      type: object
      properties:
        comment:
          type: string
          description: Why — required when rejecting
    ExpenseClaimExport:
      type: object
      required: [id, periodFrom, periodTo, createdBy, createdOn, claimCount, lineCount, totalAmount]
      properties:
        id:
          type: string
          description: The export's identifier
        periodFrom:
          type: string
          format: date
        periodTo:
          type: string
          format: date
        createdBy:
          type: string
          description: Who ran the export
        createdOn:
          type: string
          format: date-time
        claimCount:
          type: integer
          description: How many claims it collected
        lineCount:
          type: integer
          description: How many CSV rows it produced, one per expense line
        totalAmount:
          type: number
          description: What the export pays out in total
    ExpenseClaimExportInput:
      type: object
      required: [periodFrom, periodTo]
      properties:
        periodFrom:
          type: string
          format: date
          description: First day whose approved claims are included
        periodTo:
          type: string
          format: date
          description: Last day whose approved claims are included
